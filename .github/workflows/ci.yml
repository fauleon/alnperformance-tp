name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: aln_test, POSTGRES_USER: aln, POSTGRES_PASSWORD: aln}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aln -d aln_test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aln:aln@localhost:5432/aln_test
      TEST_DATABASE_URL: postgresql+asyncpg://aln:aln@localhost:5432/aln_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - name: Migrations (up, drift check, down, up)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest
      - name: Tests on SQLite too
        run: TEST_DATABASE_URL= DATABASE_URL= pytest
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
